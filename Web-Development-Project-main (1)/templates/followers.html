{% extends "base.html" %}
{% block title %}Followers{% endblock %}
{% block content %}
<div class="container mt-4">
  <h4>Followers</h4>
  <hr>
  {% if followers %}
    {% for u in followers %}
      <div class="card p-3 mb-2">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <strong>{{ u[1] }}</strong>
            <div class="text-muted small">{{ u[3] }}</div>
          </div>
          <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('profile', user_id=u[0]) }}">View</a>
        </div>
      </div>
    {% endfor %}
  {% else %}
    <p>No followers yet.</p>
  {% endif %}
</div>
{% endblock %}
