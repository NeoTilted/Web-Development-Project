<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>

    <!-- Bootstrap 4.5.2 CSS -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
          integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z"
          crossorigin="anonymous">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    {% block navbar %}{% endblock %}

    <!-- Flash messages -->
    <div class="container mt-3">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

    <div class="container-fluid px-0">
        {% block content %}{% endblock %}
    </div>


    <!-- ================= BADGE UNLOCKED MODAL (STYLED) ================= -->
    <div class="modal fade" id="badgeUnlockedModal"
         tabindex="-1" role="dialog" aria-hidden="true"
         data-backdrop="static" data-keyboard="false">

        <div class="modal-dialog modal-dialog-centered" role="document" style="max-width: 560px;">
            <div class="modal-content bb-badge-modal">

                <!-- top accent -->
                <div class="bb-badge-accent"></div>

                <div class="modal-body text-center p-4 position-relative">

                    <!-- close -->
                    <button type="button" class="close bb-badge-close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>

                    <!-- icon with glow -->
                    <div class="bb-badge-glow-wrap mx-auto mb-3">
                        <img id="badgeUnlockedIcon" class="bb-badge-icon" src="" alt="Badge icon">
                    </div>

                    <h4 class="mb-1 bb-badge-heading">Badge Unlocked!</h4>

                    <!-- badge name -->
                    <div id="badgeUnlockedTitle" class="bb-badge-title"></div>

                    <!-- optional: short status/subtitle -->
                    <div id="badgeUnlockedSubtitle" class="bb-badge-subtitle"></div>

                    <!-- description -->
                    <p id="badgeUnlockedDesc" class="bb-badge-desc mt-3 mb-0"></p>

                    <button type="button" class="btn bb-badge-btn mt-4 px-4" data-dismiss="modal">
                        Yay!
                    </button>

                </div>
            </div>
        </div>
    </div>
    <!-- =============================================================== -->


    {% block scripts %}
    <!-- jQuery, Popper, Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
            integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
            crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
            integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
            crossorigin="anonymous"></script>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
            integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV"
            crossorigin="anonymous"></script>

    <script>
        // Sidebar menu (only works if those elements exist)
        document.addEventListener('DOMContentLoaded', function () {
            const hamburgerBtn = document.querySelector('.hamburger-btn');
            const mobileNav = document.getElementById('mobile-nav');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            const closeBtn = document.querySelector('.menu-close-btn');

            if (!hamburgerBtn || !mobileNav || !sidebarOverlay) return;

            function openMenu() {
                mobileNav.classList.add('active');
                sidebarOverlay.classList.add('active');
                hamburgerBtn.setAttribute('aria-expanded', 'true');
                document.body.classList.add('menu-open');
            }

            function closeMenu() {
                mobileNav.classList.remove('active');
                sidebarOverlay.classList.remove('active');
                hamburgerBtn.setAttribute('aria-expanded', 'false');
                document.body.classList.remove('menu-open');
            }

            hamburgerBtn.addEventListener('click', openMenu);

            if (closeBtn) closeBtn.addEventListener('click', closeMenu);

            sidebarOverlay.addEventListener('click', closeMenu);

            const navLinks = mobileNav.querySelectorAll('.nav-link');
            navLinks.forEach(link => link.addEventListener('click', closeMenu));

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && mobileNav.classList.contains('active')) {
                    closeMenu();
                }
            });

            document.addEventListener('click', function (e) {
                if (mobileNav.classList.contains('active') &&
                    !mobileNav.contains(e.target) &&
                    !hamburgerBtn.contains(e.target)) {
                    closeMenu();
                }
            });
        });


        // Badge icon fallback mapping (if backend doesn't send iconSrc)
        const BADGE_ICON_MAP = {
            "Talking is fun!": "{{ url_for('static', filename='img/badges/talking.png') }}",
            "Like a lover!": "{{ url_for('static', filename='img/badges/lover.png') }}",
            "Friends": "{{ url_for('static', filename='img/badges/friends.png') }}",
            "Sharing is caring": "{{ url_for('static', filename='img/badges/share.png') }}",
            "Event Enthusiast": "{{ url_for('static', filename='img/badges/event.png') }}",
            "Weekly Interaction": "{{ url_for('static', filename='img/badges/weekly.png') }}",
            "Story Sharer": "{{ url_for('static', filename='img/badges/story.png') }}",
            "Community Builder": "{{ url_for('static', filename='img/badges/community.png') }}"
        };

        // ✅ Single showBadgeUnlocked function
        function showBadgeUnlocked(payload) {
            const iconEl = document.getElementById("badgeUnlockedIcon");
            const titleEl = document.getElementById("badgeUnlockedTitle");
            const subEl = document.getElementById("badgeUnlockedSubtitle");
            const descEl = document.getElementById("badgeUnlockedDesc");

            const badgeName = (payload.badgeName || payload.title || "New Badge").trim();


            const iconSrc = payload.iconSrc || BADGE_ICON_MAP[badgeName] || "";

            if (iconSrc) {
                iconEl.src = iconSrc;
                iconEl.style.display = "inline-block";
            } else {
                iconEl.style.display = "none";
            }

            titleEl.textContent = badgeName;
            subEl.textContent = payload.subtitle || "🎉 Completed 🎉";
            descEl.textContent = payload.desc || `You unlocked "${badgeName}". Keep going!`;

            $("#badgeUnlockedModal").modal("show");
        }
    </script>

    {% endblock %}
</body>

</html>
