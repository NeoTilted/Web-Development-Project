{% extends "base.html" %}
{% block title %}Events{% endblock %}

{% block content %}
<!-- ================= NAVBAR (SAME AS home.html) ================= -->
<div class="container-fluid px-0">
    <header class="nav-bar">
        <div class="d-flex align-items-center justify-content-between nav-inner">
            <!-- Logo -->
            <a href="{{ url_for('home') }}" class="logo-link">
                <img src="{{ url_for('static', filename='img/Logo.png') }}" alt="Logo" class="logo-img">
            </a>

            <!-- Search -->
          <div class="search-container">
            <form class="form-inline m-0"
                  action="{{ url_for('search') }}"
                  method="GET">
              <div class="input-group">
                <input type="search"
                       name="query"
                       placeholder="Search"
                       class="form-control"
                       value="{{ query if query is defined else '' }}" />
                <div class="input-group-append">
                  <button class="btn btn-outline-light" type="submit">🔍</button>
                </div>
              </div>
            </form>
          </div>

            <!-- Hamburger Menu -->
            <button class="btn btn-dark hamburger-btn btn-size" type="button" aria-label="Toggle navigation"
                aria-controls="mobile-nav" aria-expanded="false">
                ☰
            </button>
        </div>
    </header>
</div>
<!-- Overlay (hidden by default) -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Off-canvas Sidebar (right side) -->
<nav id="mobile-nav" aria-label="Main navigation">
    <button class="menu-close-btn" aria-label="Close menu">&times;</button>
    <ul class="nav-list list-unstyled mb-0">
        <li><a href="{{ url_for('home') }}" class="nav-link text-white">Home</a></li>
        <li><a href=" {{ url_for('explore') }}" class="nav-link text-white">Explore</a></li>
        <li><a href="{{ url_for('createPost') }}" class="nav-link text-white">Create</a></li>
        <li><a href="{{ url_for('events') }}" class="nav-link text-white active">Events</a></li>
        <li><a href="{{ url_for('profile', user_id=session['user_id']) }}" class="nav-link text-white">Profile</a></li>
        <li><hr class="bg-light my-3"></li>
        <!-- Additional Links -->
        <li><a href="{{ url_for('logout') }}" class="nav-link text-danger">Logout</a></li>
    </ul>
</nav>
<!-- ============================================================ -->


<!-- ================= PAGE CONTENT ================= -->
<div class="container mt-3">

    <!-- Create Event Button -->
    <button class="create-event-btn">Create Event</button>

    <!-- Event Form -->
    <form class="event-form" method="POST" action="{{ url_for('events') }}">
        <div class="form-group">
            <label class="form-label">Name of event:</label>
            <input type="text" class="form-input" name="event_name" required>
        </div>

        <div class="form-group">
            <label class="form-label">Location of event:</label>
            <input type="text" class="form-input" name="location" required>
        </div>

        <div class="form-group">
            <label class="form-label">Itinerary of event:</label>
            <textarea class="form-textarea" name="event_itinerary"></textarea>
        </div>

        <div class="form-group">
            <label class="form-label">Date & time of event:</label>
            <input type="datetime-local" class="form-input" name="event_date" required>
        </div>

        <div class="form-group">
            <label class="form-label">Duration (minutes):</label>
            <input type="number" class="form-input" name="event_duration" min="1" placeholder="e.g. 60">
        </div>

        <div class="form-group">
            <label class="form-label">Max participants:</label>
            <input type="number" class="form-input" name="max_participants" min="1" value="10">
        </div>

        <!-- Badge Notice -->
        <div class="badge-notice">
            Hosting/attending 5 events will grant users a badge!!!
        </div>

        <!-- Post Button -->
        <button class="post-btn" type="submit">Post</button>
    </form>

</div>
<!-- ================================================= -->

{% endblock %}
