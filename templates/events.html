{% extends "base.html" %}
{% block content %}

<!-- PAGE WRAPPER -->
<div class="evt-create">

<div class="container-fluid px-0">
    <header class="nav-bar">
      <div class="container-fluid px-0">
        <div class="d-flex align-items-center justify-content-between nav-inner">
          <!-- Logo -->
          <a href="{{ url_for('home') }}" class="logo-link"><img src="{{ url_for('static', filename='img/Logo.png') }}" alt="Logo" class="logo-img" /></a>

          <!-- Search -->
          <div class="search-container">
            <form class="form-inline m-0">
              <div class="input-group">
                <input type="search" placeholder="Search" class="form-control" />
                <div class="input-group-append">
                  <a href="{{ url_for('events') }}" class="btn btn-outline-light" title="Random Event">🎲</a>
                  <button class="btn btn-outline-light" type="button">🔍</button>
                </div>
              </div>
            </form>
          </div>

          <!-- Hamburger -->
          <button class="btn btn-dark hamburger-btn btn-size" type="button">☰</button>
        </div>
      </div>
    </header>
  </div>

  <!-- Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <nav id="mobile-nav">
    <button class="menu-close-btn">&times;</button>
    <ul class="nav-list list-unstyled mb-0">
      <li>
        <a href="{{ url_for('home') }}" class="nav-link text-white">Home</a>
      </li>
      <li>
        <a href="{{ url_for('explore') }}" class="nav-link text-white">Explore</a>
      </li>
      <li>
        <a href="" class="nav-link text-white">Friends</a>
      </li>
      <li>
        <a href="{{ url_for('createPost') }}" class="nav-link text-white">Create</a>
      </li>
      <li>
        <a href="{{ url_for('profile') }}" class="nav-link text-white">Profile</a>
      </li>
      <li>
        <hr class="bg-light my-3" />
      </li>
      <li>
        <a href="#" class="nav-link text-danger">Logout</a>
      </li>
    </ul>
  </nav>

  <!-- =========================
       PAGE CONTENT
       ========================= -->
  <main class="evt-page-content">

    <!-- Create Event Button -->
    <button class="evt-create-event-btn">Create Event</button>

    <!-- Event Form -->
    <div class="evt-event-form">

      <div class="evt-form-group">
        <label class="evt-form-label" for="event-name">Name of event:</label>
        <input type="text"
               id="event-name"
               class="evt-form-input">
      </div>

      <div class="evt-form-group">
        <label class="evt-form-label" for="event-location">Location of event:</label>
        <input type="text"
               id="event-location"
               class="evt-form-input">
      </div>

      <div class="evt-form-group">
        <label class="evt-form-label" for="event-itinerary">Itinerary of event:</label>
        <textarea id="event-itinerary"
                  class="evt-form-textarea"></textarea>
      </div>

      <div class="evt-form-group">
        <label class="evt-form-label" for="event-time">Time of event:</label>
        <input type="text"
               id="event-time"
               class="evt-form-input">
      </div>

      <!-- Badge Notice -->
      <div class="evt-badge-notice">
        Hosting/attending 5 events will grant users a badge!!!
      </div>

      <!-- Post Button -->
      <button class="evt-post-btn">Post</button>

    </div>

  </main>

</div>

{% endblock %}
