{% extends 'base.html' %}
{% block title %}
  Bond Buddies - Create Post
{% endblock %}

{% block content %}
  <div class="container-fluid px-0">
    <header class="nav-bar">
      <div class="container-fluid px-0">
        <div class="d-flex align-items-center justify-content-between nav-inner">
          <!-- Logo -->
          <a href="{{ url_for('home') }}" class="logo-link"><img src="{{ url_for('static', filename='img/Logo.png') }}" alt="Logo" class="logo-img" /></a>

          <!-- Search -->
          <div class="search-container">
            <form class="form-inline m-0">
              <div class="input-group">
                <input type="search" placeholder="Search" class="form-control" />
                <div class="input-group-append">
                  <a href="{{ url_for('events') }}" class="btn btn-outline-light" title="Random Event">🎲</a>
                  <button class="btn btn-outline-light" type="button">🔍</button>
                </div>
              </div>
            </form>
          </div>

          <!-- Hamburger -->
          <button class="btn btn-dark hamburger-btn btn-size" type="button">☰</button>
        </div>
      </div>
    </header>
  </div>

  <!-- Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <nav id="mobile-nav">
    <button class="menu-close-btn">&times;</button>
    <ul class="nav-list list-unstyled mb-0">
      <li>
        <a href="{{ url_for('home') }}" class="nav-link text-white">Home</a>
      </li>
      <li>
        <a href="{{ url_for('explore') }}" class="nav-link text-white">Explore</a>
      </li>
      <li>
        <a href="" class="nav-link text-white">Friends</a>
      </li>
      <li>
        <a href="{{ url_for('createPost') }}" class="nav-link text-white active">Create</a>
      </li>
      <li>
        <a href="{{ url_for('profile') }}" class="nav-link text-white">Profile</a>
      </li>
      <li>
        <hr class="bg-light my-3" />
      </li>
      <li>
        <a href="#" class="nav-link text-danger">Logout</a>
      </li>
    </ul>
  </nav>

  <div class="center-box">
    <div class="upload-card">
      <h4 class="text-center mb-4">Upload a Picture</h4>

      <form id="uploadForm" method="POST" enctype="multipart/form-data">
        <div class="row">
          <!-- LEFT SIDE -->
          <div class="col-md-6 d-flex align-items-center justify-content-center">
            <div class="text-center">
              <input type="file" id="fileInput" name="image" accept="image/*" onchange="previewImage(event)" hidden />

              <div id="fileName">No file chosen</div>

              <label for="fileInput" class="custom-file-btn">Choose File</label>

              <img id="preview" class="img-fluid hidden mt-3" alt="Image Preview" />
            </div>
          </div>

          <!-- RIGHT SIDE -->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="content" class="form-label">Post Content</label>
              <textarea class="form-control" id="content" name="content" placeholder="What's on your mind?" rows="4" resize="none"></textarea>
            </div>

            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <select class="form-control" id="category" name="category">
                <option value="senior">Senior Post</option>
                <option value="youth">Youth Post</option>
              </select>
            </div>
          </div>
        </div>

        <!-- POST BUTTON -->
        <div class="post-btn-wrapper">
          <button type="submit" class="btn btn-primary btn-post px-5">Post</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Missing file modal -->
  <div class="modal fade" id="fileWarningModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Missing File</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">Please upload a photo before posting!</div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('uploadForm')
      const fileInput = document.getElementById('fileInput')
      const modal = new bootstrap.Modal(document.getElementById('fileWarningModal'))
    
      form.addEventListener('submit', function (e) {
        if (!fileInput.files.length) {
          e.preventDefault()
          modal.show()
        }
      })
    })
    
    function previewImage(event) {
      const file = event.target.files[0]
      if (!file) return
    
      const preview = document.getElementById('preview')
      const fileName = document.getElementById('fileName')
    
      preview.src = URL.createObjectURL(file);
      preview.classList.remove('hidden');
      preview.style.display = 'block'; // optional safety
      fileName.textContent = file.name
    }
  </script>
{% endblock %}
