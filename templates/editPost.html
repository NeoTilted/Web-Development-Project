{% extends 'base.html' %}
{% block title %}Bond Buddies - Edit Post{% endblock %}

{% block content %}
<div class="container-fluid px-0">
    <header class="nav-bar">
      <div class="container-fluid px-0">
        <div class="d-flex align-items-center justify-content-between nav-inner">
          <!-- Logo -->
          <a href="{{ url_for('home') }}" class="logo-link"><img src="{{ url_for('static', filename='img/Logo.png') }}" alt="Logo" class="logo-img" /></a>

          <!-- Search -->
          <div class="search-container">
            <form class="form-inline m-0">
              <div class="input-group">
                <input type="search" placeholder="Search" class="form-control" />
                <div class="input-group-append">
                  <a href="{{ url_for('events') }}" class="btn btn-outline-light" title="Random Event">🎲</a>
                  <button class="btn btn-outline-light" type="button">🔍</button>
                </div>
              </div>
            </form>
          </div>

          <!-- Hamburger -->
          <button class="btn btn-dark hamburger-btn btn-size" type="button">☰</button>
        </div>
      </div>
    </header>
  </div>

  <!-- Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <nav id="mobile-nav">
    <button class="menu-close-btn">&times;</button>
    <ul class="nav-list list-unstyled mb-0">
      <li>
        <a href="{{ url_for('home') }}" class="nav-link text-white">Home</a>
      </li>
      <li>
        <a href="{{ url_for('explore') }}" class="nav-link text-white">Explore</a>
      </li>
      <li>
        <a href="" class="nav-link text-white">Friends</a>
      </li>
      <li>
        <a href="{{ url_for('createPost') }}" class="nav-link text-white">Create</a>
      </li>
      <li>
        <a href="{{ url_for('profile') }}" class="nav-link text-white">Profile</a>
      </li>
      <li>
        <hr class="bg-light my-3" />
      </li>
      <li>
        <a href="#" class="nav-link text-danger">Logout</a>
      </li>
    </ul>
  </nav>
<div class="center-box">
  <div class="upload-card">
    <h4 class="text-center mb-4">Edit Post</h4>

    <form id="editForm" method="POST" enctype="multipart/form-data">
      <div class="row">
        <!-- LEFT SIDE: Image -->
        <div class="col-md-6 d-flex align-items-center justify-content-center">
          <div class="text-center">
            <input type="file" id="fileInput" name="image" accept="image/*" onchange="previewImage(event)" hidden>

            <div id="fileName">
              {% if post['image_url'] %}
                {{ post['image_url'] }}
              {% else %}
                No file chosen
              {% endif %}
            </div>

            <label for="fileInput" class="custom-file-btn">Choose File</label>

            <img id="preview"
                 class="img-fluid mt-3 {% if post['image_url'] %}visible{% else %}hidden{% endif %}"
                 src="{% if post['image_url'] %}{{ url_for('static', filename='uploads/' ~ post['image_url']) }}{% endif %}"
                 alt="Post Image">
          </div>
        </div>

        <!-- RIGHT SIDE: Content & Category -->
        <div class="col-md-6">
          <div class="mb-3">
            <label for="content" class="form-label">Post Content</label>
            <textarea class="form-control" id="content" name="content" rows="4">{{ post['content'] }}</textarea>
          </div>

          <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select class="form-control" id="category" name="category">
              <option value="senior" {% if post['post_category'] == 'senior' %}selected{% endif %}>Senior Post</option>
              <option value="youth" {% if post['post_category'] == 'youth' %}selected{% endif %}>Youth Post</option>
            </select>
          </div>
        </div>
      </div>

      <div class="post-btn-wrapper">
        <button type="submit" class="btn btn-success btn-post px-5">Update Post</button>
      </div>
    </form>
  </div>
</div>

<script>
function previewImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    const preview = document.getElementById('preview');
    const fileName = document.getElementById('fileName');

    preview.src = URL.createObjectURL(file);
    preview.classList.remove('hidden');
    preview.classList.add('visible');

    fileName.textContent = file.name;
}
</script>
{% endblock %}
